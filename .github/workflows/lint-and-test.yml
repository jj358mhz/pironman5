name: lint-and-test

on:
  pull_request:
  push:
    branches: [v1]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install argcomplete pytest
          pip install -e . --no-deps

      - name: Shell syntax check
        run: |
          for f in install.sh scripts/*.sh docker-entrypoint.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Run tests
        run: |
          pytest tests/ -v --ignore=tests/test_dashboard_api.py
